[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symlang"
version = "1.0.0"
description = "Experimental symbolic encodings for one fixed grammar, a lossless zlib codec, and a token-aware, round-trip-verified router (alpha)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "SymLang Open Source Contributors" }
]
keywords = [
    "nlp",
    "compression",
    "llm",
    "prompt-compression",
    "neuro-symbolic",
    "ast",
    "tokenization",
    "information-theory"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Archiving :: Compression"
]
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0"
]

[project.scripts]
symlang = "cli:main"

[project.urls]
Homepage = "https://github.com/teminali/symlang"
Documentation = "https://github.com/teminali/symlang#readme"
Repository = "https://github.com/teminali/symlang"
Issues = "https://github.com/teminali/symlang/issues"
